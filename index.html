
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musique Pétanque Soullandaise</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f2f2f2;
  padding: 25px 10px;
}

#lecteur {
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border: 2px solid #198754;
  border-radius: 18px;
  box-shadow: 0 3px 12px #aaa;
}

button {
  padding: 14px 22px;
  margin: 8px;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

#marche { background: #198754; }
#arret { background: #dc3545; }
#retour { background: #0d6efd; }

#statut {
  font-weight: bold;
  margin: 18px;
}

input[type="range"] {
  width: 85%;
}
</style>
</head>

<body>

<div id="lecteur">
  <h2>🎵 PÉTANQUE SOULLANDAISE</h2>
  <p>Musique du club</p>

  <audio id="musique"
    src="https://raw.githubusercontent.com/212035Am/Musique-soullandaise/main/03%20-%20Sur%20le%20Terrain.mp3"
    loop>
  </audio>

  <button id="marche">▶ MARCHE</button>
  <button id="arret">■ ARRÊT</button>

  <p>Volume</p>
  <input id="volume" type="range" min="0" max="1"
    step="0.05" value="0.7">

  <p id="statut">Musique arrêtée</p>

  <button id="retour">↩ RETOUR KALISPORT</button>
</div>

<script>
const musique = document.getElementById("musique");
const statut = document.getElementById("statut");

musique.volume = 0.7;

document.getElementById("marche").addEventListener("click", function() {
  musique.play()
    .then(() => {
      statut.textContent = "🎵 Musique en cours";
    })
    .catch(() => {
      statut.textContent = "Impossible de lancer la musique";
    });
});

document.getElementById("arret").addEventListener("click", function() {
  musique.pause();
  statut.textContent = "Musique arrêtée";
});

document.getElementById("volume").addEventListener("input", function() {
  musique.volume = Number(this.value);
});

document.getElementById("retour").addEventListener("click", function() {
  if (window.opener && !window.opener.closed) {
    window.opener.focus();
  } else {
    alert("Utilisez les onglets de Chrome pour revenir à Kalisport. Ne fermez pas cet onglet si vous souhaitez garder la musique.");
  }
});
</script>

</body>
</html>
