
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musique Pétanque Soullandaise</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  text-align: center;
  padding: 20px;
}

.lecteur {
  max-width: 420px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 3px 12px #0003;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 15px 20px;
  margin: 5px;
  font-size: 17px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

#marche { background: #198754; }
#arret { background: #dc3545; }
#retour { background: #0d6efd; width: 100%; }

select {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border-radius: 8px;
}

input[type=range] {
  width: 100%;
}
</style>
</head>

<body>

<div class="lecteur">

<h2>🎵 MUSIQUE DU CLUB</h2>
<p>Pétanque Soullandaise</p>

<label>Choisir une musique :</label>
<br><br>

<select id="choix">
  <option value="03-Sur%20le%20Terrain.mp3">
    Sur le Terrain
  </option>
  <option value="popdance.mp3">
    Pop Dance
  </option>
  <option value="la%20fete.mp3">
    La fête
  </option>

<option value="08%20-%20Ce%20soir,%20Soullans%20fait%20la%20fête%20!.mp3">
  Ce soir, Soullans fait la fête !
</option>
</select>



<br><br>

<audio id="audio" preload="auto"></audio>

<button id="marche" onclick="lecture()">
▶ MARCHE
</button>

<button id="arret" onclick="arretMusique()">
■ ARRÊT
</button>

<br><br>

<label>🔊 Volume</label>
<input type="range" id="volume"
min="0" max="1" step="0.05" value="0.7">

<p id="statut">Musique arrêtée</p>

<hr>

<br>

<button id="retour" onclick="retourKalisport()">
↩ RETOUR À KALISPORT
</button>

</div>

<script>

const base =
"https://212035am.github.io/Musique-soullandaise/";

const audio = document.getElementById("audio");
const choix = document.getElementById("choix");
const statut = document.getElementById("statut");
const volume = document.getElementById("volume");

// Chargement de la musique
function chargerMusique() {
  audio.src = base + choix.value;
  audio.load();
}

chargerMusique();

// Changement de musique
choix.addEventListener("change", function() {
  audio.pause();
  audio.currentTime = 0;
  chargerMusique();
  statut.textContent = "Musique arrêtée";
});

// Réglage du volume
volume.addEventListener("input", function() {
  audio.volume = this.value;
});

audio.volume = 0.7;

// Lecture
function lecture() {
  audio.play().then(function() {
    statut.textContent = "Musique en cours";
  }).catch(function() {
    statut.textContent = "Erreur de lecture du MP3";
  });
}

// Arrêt
function arretMusique() {
  audio.pause();
  audio.currentTime = 0;
  statut.textContent = "Musique arrêtée";
}

// Fin de musique
audio.addEventListener("ended", function() {
  statut.textContent = "Musique terminée";
});

// Retour vers Kalisport sans fermer le lecteur
function retourKalisport() {
  if (window.opener && !window.opener.closed) {
// window.opener.focus();
    window.open("https://petanquesoullandaise.fr", "Kalisport").focus();
    
    statut.textContent =
      "Musique maintenue - retour demandé à Kalisport";
  } else {
    statut.textContent =
      "Utilisez les onglets Chrome pour revenir à Kalisport.";
  }
}

</script>

</body>
</html>
