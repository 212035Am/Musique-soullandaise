<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musique Pétanque Soullandaise</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  text-align: center;
  padding: 20px;
}

.lecteur {
  max-width: 420px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 3px 12px #0003;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 15px 20px;
  margin: 5px;
  font-size: 17px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

#marche { background: #198754; }
#arret { background: #dc3545; }
#retour { background: #0d6efd; width: 100%; }

select {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border-radius: 8px;
}

input[type=range] {
  width: 100%;
}

/* Case lecture enchaînée */
.enchaine {
  margin: 15px 0;
  padding: 12px;
  background: #f0f0f0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}

.enchaine input {
  width: 20px;
  height: 20px;
  vertical-align: middle;
}
</style>
</head>

<body>

<div class="lecteur">

<h2>🎵 MUSIQUE DU CLUB</h2>
<p>Pétanque Soullandaise</p>

<label>Choisir une musique :</label>
<br><br>

<select id="choix">

  <option value="03-Sur%20le%20Terrain.mp3">
    Sur le Terrain
  </option>


  <option value="la%20fete.mp3">
    La fête
  </option>

  <option value="08%20-%20Ce%20soir,%20Soullans%20fait%20la%20fête%20!.mp3">
    Ce soir, Soullans fait la fête !
  </option>

  <option value="07%20-%2025%20ans%20Ensemble.mp3">
    25 ans Ensemble
  </option>

  <option value="06%20-%20Tous%20sur%20le%20Boulodrome.mp3">
    Tous sur le Boulodrome
  </option>

  <option value="05%20-%20Au%20fil%20des%20années.mp3">
    Au fil des années
  </option>

  <option value="04%20-%20Une%20histoire%20de%20copains.mp3">
    Une histoire de copains
  </option>
  <option value="02%20-%20Les%20premières%20années.mp3">
  Les premières années
  </option>
  
  <option value="01%20-%20Il%20était%20une%20fois%20la%20pétanque%20Soullandaise.mp3">
  Il était une fois la pétanque Soullandaise
  </option>
</select>

<br><br>

<!-- Lecture enchaînée -->
<div class="enchaine">
  <label>
    <input type="checkbox" id="enchainee">
    ☑ Lecture des chansons à la suite
  </label>
</div>

<audio id="audio" preload="auto"></audio>

<button id="marche" onclick="lecture()">
▶ MARCHE
</button>

<button id="arret" onclick="arretMusique()">
■ ARRÊT
</button>

<br><br>

<label>🔊 Volume</label>
<input type="range" id="volume"
min="0" max="1" step="0.05" value="0.7">

<p id="statut">Musique arrêtée</p>

<hr>

<br>

<button id="retour" onclick="retourKalisport()">
↩ RETOUR À KALISPORT
</button>

</div>

<script>

const base =
"https://212035am.github.io/Musique-soullandaise/";

const audio = document.getElementById("audio");
const choix = document.getElementById("choix");
const statut = document.getElementById("statut");
const volume = document.getElementById("volume");
const enchainee = document.getElementById("enchainee");


// ===============================
// CHARGEMENT DE LA MUSIQUE
// ===============================

function chargerMusique() {

  audio.src = base + choix.value;
  audio.load();

}

chargerMusique();


// ===============================
// CHANGEMENT DE MUSIQUE
// ===============================

choix.addEventListener("change", function() {

  audio.pause();
  audio.currentTime = 0;

  chargerMusique();

  statut.textContent = "Musique arrêtée";

});


// ===============================
// VOLUME
// ===============================

volume.addEventListener("input", function() {

  audio.volume = this.value;

});

audio.volume = 0.7;


// ===============================
// LECTURE
// ===============================

function lecture() {

  audio.play().then(function() {

    statut.textContent = "🎵 Musique en cours";

  }).catch(function() {

    statut.textContent = "Erreur de lecture du MP3";

  });

}


// ===============================
// ARRÊT
// ===============================

function arretMusique() {

  audio.pause();
  audio.currentTime = 0;

  statut.textContent = "Musique arrêtée";

}


// ===============================
// FIN DE MUSIQUE
// ===============================

audio.addEventListener("ended", function() {

  // Si la lecture enchaînée est activée
  if (enchainee.checked) {

    // Cherche la chanson suivante
    let prochaine =
      choix.selectedIndex + 1;

    // Si on arrive à la fin de la liste,
    // on recommence au premier morceau
    if (prochaine >= choix.options.length) {
      prochaine = 0;
    }

    // Sélection de la chanson suivante
    choix.selectedIndex = prochaine;

    // Chargement
    chargerMusique();

    // Lecture automatique
    audio.play().then(function() {

      statut.textContent =
        "🎵 Lecture enchaînée : " +
        choix.options[choix.selectedIndex].text;

    }).catch(function() {

      statut.textContent =
        "Erreur de lecture du MP3";

    });

  } else {

    statut.textContent = "Musique terminée";

  }

});


// ===============================
// RETOUR À KALISPORT
// ===============================

function retourKalisport() {

  if (window.opener && !window.opener.closed) {

    window.open(
      "https://petanquesoullandaise.fr",
      "Kalisport"
    ).focus();

    statut.textContent =
      "Musique maintenue - retour demandé à Kalisport";

  } else {

    statut.textContent =
      "Utilisez les onglets Chrome pour revenir à Kalisport.";

  }

}

</script>

</body>
</html>
