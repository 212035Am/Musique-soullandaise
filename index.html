
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musique Pétanque Soullandaise</title>

<style>
body {
  margin:0;
  padding:15px;
  background:#f2f4f6;
  font-family:Arial,sans-serif;
  text-align:center;
  color:#222;
}

.lecteur {
  max-width:430px;
  margin:15px auto;
  padding:25px 18px;
  background:white;
  border:2px solid #ccc;
  border-radius:18px;
  box-shadow:0 4px 16px #0002;
}

h2 {font-size:22px;}

button {
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

#bouton {background:#198754;}
#bouton.arret {background:#dc3545;}
#retour {background:#0d6efd;}

.volume {
  margin-top:22px;
  text-align:left;
}

input[type=range] {width:100%;}

.note {
  font-size:13px;
  color:#666;
  line-height:1.5;
  margin-top:18px;
}

#statut {
  font-size:14px;
  color:#555;
  margin-top:12px;
}

</style>
</head>

<body>

<div class="lecteur">

<h2>🎵 MUSIQUE DU CLUB</h2>

<p>Pétanque Soullandaise — Sur le Terrain</p>

<button id="bouton" type="button">
▶ MARCHE
</button>

<div class="volume">

<label>
Volume : <span id="valeur">25 %</span>
</label>

<input
id="volume"
type="range"
min="0"
max="1"
step="0.05"
value="0.25">

</div>

<p id="statut">Musique à l'arrêt</p>

<button id="retour" type="button">
↩ RETOUR À KALISPORT
</button>

<p class="note">
Lecture en boucle.
Appuyez sur MARCHE pour démarrer.
</p>

<audio id="audio" loop preload="none"></audio>

</div>

<script>

(function() {

const audio = document.getElementById("audio");
const bouton = document.getElementById("bouton");
const retour = document.getElementById("retour");
const volume = document.getElementById("volume");
const valeur = document.getElementById("valeur");
const statut = document.getElementById("statut");

// Adresse OneDrive du MP3
const lienMusique =
"https://api.onedrive.com/v1.0/shares/u!aHR0cHM6Ly8xZHJ2Lm1zL3UvYy9lNjllZDg3MjU3MWRhOGFjL0lRQjJmZkNHZ0cxZlRhbVM0UHJwd3IwY0FZQ25RdmJ4ako0aDJYV3N4VXZrVVJV/root/content";

audio.src = lienMusique;
audio.volume = 0.25;

function afficher() {

  const actif = !audio.paused;

  bouton.textContent = actif
    ? "⏹ ARRÊT"
    : "▶ MARCHE";

  bouton.classList.toggle("arret", actif);

  statut.textContent = actif
    ? "🎵 Musique en cours"
    : "Musique à l'arrêt";
}

bouton.addEventListener("click", async function() {

  if (!audio.paused) {

    audio.pause();
    audio.currentTime = 0;
    afficher();

  } else {

    statut.textContent = "Chargement de la musique...";

    try {
      await audio.play();
      afficher();

    } catch(error) {

      statut.textContent = "Erreur de lecture";

      alert(
        "Impossible de lire le MP3. Vérifiez le lien OneDrive."
      );

      afficher();
    }
  }
});

volume.addEventListener("input", function() {

  audio.volume = Number(volume.value);

  valeur.textContent =
    Math.round(audio.volume * 100) + " %";
});

audio.addEventListener("play", afficher);
audio.addEventListener("pause", afficher);

audio.addEventListener("error", function() {
  statut.textContent = "Erreur de chargement du MP3";
});

retour.addEventListener("click", function() {
  window.location.href =
    "https://petanquesoullandaise.fr";
});

afficher();

})();

</script>

</body>
</html>
