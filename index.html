
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musique Pétanque Soullandaise</title>
<style>
body {
  margin:0;
  padding:15px;
  background:#f2f4f6;
  font-family:Arial,sans-serif;
  text-align:center;
}
.lecteur {
  max-width:430px;
  margin:15px auto;
  padding:25px 18px;
  background:white;
  border:2px solid #ccc;
  border-radius:18px;
  box-shadow:0 4px 16px #0002;
}
button {
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:19px;
  font-weight:bold;
  margin-top:12px;
}
#bouton {background:#198754;}
#bouton.arret {background:#dc3545;}
#retour {background:#0d6efd;}
.volume {margin-top:22px;text-align:left;}
input[type=range] {width:100%;}
.note {font-size:13px;color:#666;margin-top:18px;}
</style>
</head>
<body>

<div class="lecteur">
<h2>🎵 MUSIQUE DU CLUB</h2>
<p>Pétanque Soullandaise — Sur le Terrain</p>

<button id="bouton">▶ MARCHE</button>

<div class="volume">
<label>Volume : <span id="valeur">25 %</span></label>
<input id="volume" type="range"
min="0" max="1" step="0.05" value="0.25">
</div>

<button id="retour">↩ RETOUR À KALISPORT</button>

<p class="note">Lecture en boucle</p>

<audio id="audio" loop preload="none"
src="https://raw.githubusercontent.com/212035Am/Musique-soullandaise/main/03%20-%20Sur%20le%20Terrain.mp3">
</audio>
</div>

<script>
const audio = document.getElementById("audio");
const bouton = document.getElementById("bouton");
const volume = document.getElementById("volume");
const valeur = document.getElementById("valeur");

audio.volume = 0.25;

function afficher() {
  const actif = !audio.paused;
  bouton.textContent = actif ? "⏹ ARRÊT" : "▶ MARCHE";
  bouton.classList.toggle("arret", actif);
}

bouton.onclick = async function() {
  if (!audio.paused) {
    audio.pause();
    audio.currentTime = 0;
  } else {
    try {
      await audio.play();
    } catch(e) {
      alert("Lecture impossible. Vérifiez le fichier GitHub.");
    }
  }
  afficher();
};

volume.oninput = function() {
  audio.volume = Number(volume.value);
  valeur.textContent = Math.round(audio.volume * 100) + " %";
};

audio.onplay = afficher;
audio.onpause = afficher;

document.getElementById("retour").onclick = function() {
  location.href = "https://petanquesoullandaise.fr";
};

afficher();
</script>
</body>
</html>
