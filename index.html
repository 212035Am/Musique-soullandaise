
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musique Pétanque Soullandaise</title>
</head>

<body style="font-family:Arial;background:#f2f2f2;text-align:center;padding:20px;">

<div style="
max-width:420px;
margin:30px auto;
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 3px 12px #0003;
">

<h2>🎵 PÉTANQUE SOULLANDAISE</h2>
<p>Lecteur musical du club</p>

<select id="choix" style="width:100%;padding:12px;font-size:16px;border-radius:8px;">
<option value="03-Sur%20le%20Terrain.mp3">Sur le Terrain</option>
<option value="popdance.mp3">Pop Dance</option>
</select>

<br><br>

<audio id="audio" preload="auto" style="width:100%;">
</audio>

<button onclick="lecture()" style="
background:#198754;color:white;border:0;
padding:15px 25px;border-radius:10px;
font-size:18px;font-weight:bold;">
▶ MARCHE
</button>

<button onclick="arret()" style="
background:#dc3545;color:white;border:0;
padding:15px 25px;border-radius:10px;
font-size:18px;font-weight:bold;">
■ ARRÊT
</button>

<br><br>

<label>🔊 Volume</label><br>
<input type="range" min="0" max="1" step="0.05"
value="0.7" id="volume" style="width:100%;">

<p id="statut">Musique arrêtée</p>

<hr>

<a href="https://petanquesoullandaise.fr"
style="
display:inline-block;
background:#0d6efd;
color:white;
padding:14px 22px;
border-radius:10px;
text-decoration:none;
font-size:17px;
font-weight:bold;">
↩ RETOUR À KALISPORT
</a>
<a href="https://petanquesoullandaise.fr"
target="_blank"
style="
display:inline-block;
background:#0d6efd;
color:white;
padding:14px 22px;
border-radius:10px;
text-decoration:none;
font-size:17px;
font-weight:bold;">
↩ RETOUR À KALISPORT
</a>
</div>

<script>
const base = "https://212035am.github.io/Musique-soullandaise/";
const audio = document.getElementById("audio");
const choix = document.getElementById("choix");
const statut = document.getElementById("statut");

audio.src = base + choix.value;
audio.volume = 0.7;

choix.addEventListener("change", function() {
  audio.pause();
  audio.currentTime = 0;
  audio.src = base + choix.value;
  statut.textContent = "Musique arrêtée";
});

document.getElementById("volume").addEventListener("input", function() {
  audio.volume = this.value;
});

function lecture() {
  audio.play().then(function() {
    statut.textContent = "Musique en cours";
  }).catch(function() {
    statut.textContent = "Erreur de lecture du MP3";
  });
}

function arret() {
  audio.pause();
  audio.currentTime = 0;
  statut.textContent = "Musique arrêtée";
}

audio.addEventListener("ended", function() {
  statut.textContent = "Musique terminée";
});
</script>

</body>
</html>
